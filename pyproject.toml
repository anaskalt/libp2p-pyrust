[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "libp2p-pyrust"
requires-python = ">=3.8"
authors = [
    { name = "Anastasios Kaltakis", email = "anastasioskaltakis@gmail.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",

    "Operating System :: OS Independent",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",


    "Environment :: Console",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: Communications",
]

dynamic = [
    "description",
    "license",
    "readme",
    "version"
]

[project.urls]
Homepage = "https://github.com/anaskalt/libp2p-pyrust"
Documentation = "https://github.com/anaskalt/libp2p-pyrust#readme"
Repository = "https://github.com/anaskalt/libp2p-pyrust"
"Bug Reports" = "https://github.com/anaskalt/libp2p-pyrust/issues"
Changelog = "https://github.com/anaskalt/libp2p-pyrust/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "pyo3"
module-name = "libp2p_pyrust.libp2p_pyrust"
features = ["pyo3/extension-module", "pyo3/generate-import-lib"]

python-source = "libp2p_pyrust"
strip = true  # Strip debug symbols from release builds
include = [
    { path = "libp2p_pyrust/__init__.py", format = "sdist" },
    { path = "libp2p_pyrust/py.typed", format = "sdist" },
    { path = "README.md", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
]

# Test and development tool configurations
[tool.coverage.run]
source = ["libp2p_pyrust"]
branch = true

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.ruff]
line-length = 120
extend-select = ["Q", "RUF100", "UP", "I"]
flake8-quotes = {inline-quotes = "single", multiline-quotes = "double"}
format.quote-style="single"
target-version = "py38"

[tool.mypy]
follow_imports = "normal"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
