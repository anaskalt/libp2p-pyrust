[build-system]
requires = ["setuptools", "wheel", "setuptools-rust"]
build-backend = "setuptools.build_meta"

[project]
name = "libp2p-pyrust"
requires-python = ">=3.8"
version = "0.1.0"
authors = [
    { name = "Anastasios Kaltakis", email = "anastasioskaltakis@gmail.com" }
]
description = "Python bindings for libp2p implemented in Rust"
readme = "README.rst"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages]
# Pure Python packages/modules
find = { where = ["python"] }

[[tool.setuptools-rust.ext-modules]]
# Rust extension module to be nested into Python package
target = "libp2p_pyrust.libp2p_pyrust"