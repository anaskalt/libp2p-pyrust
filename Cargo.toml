[package]
name = "libp2p-pyrust"
version = "0.1.0"
authors = ["Anastasios Kaltakis <anastasioskaltakis@gmail.com>"]
edition = "2021"
description = "Python bindings for libp2p implemented in Rust"
license = "MIT"

[dependencies]
libp2p = { version = "0.53.2", features = ["tokio", "gossipsub", "mdns", "noise", "macros", "tcp", "yamux", "quic", "dns", "kad", "rsa", "identify"] }
pyo3 = { version = "0.20.2", features = ["extension-module", "generate-import-lib"] }
pyo3-asyncio = { version = "0.20.0", features = ["tokio-runtime"] }
tokio = { version = "1.34", features = ["full"] }
async-trait = "0.1"
futures = "0.3.29"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
env_logger = "0.10"
anyhow = "1.0.75"
chrono = "0.4"
async-stream = "0.3.5"
lazy_static = "1.4.0"
multihash = "0.19.1"
base64 = "0.21.7"
log = "0.4"

[lib]
name = "libp2p_pyrust"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = "fat"
codegen-units = 1
