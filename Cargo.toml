[package]
name = "libp2p-pyrust"
version = "0.1.0"
authors = ["Anastasios Kaltakis <anastasioskaltakis@gmail.com>"]
edition = "2021"
description = "Python bindings for libp2p implemented in Rust"
license = "MIT"

[dependencies]
# Core P2P networking with optimized features for production
libp2p = { version = "0.56.0", features = ["tokio", "gossipsub", "mdns", "noise", "macros", "tcp", "yamux", "quic", "dns", "kad", "rsa", "identify", "cbor", "request-response"] }

# Python bindings - CRITICAL SECURITY UPDATE from 0.20.2 to 0.27.1
# Fixes CVE buffer overflow in PyString::from_object
pyo3 = { version = "0.27.1", features = ["extension-module", "generate-import-lib"] }

# Async runtime bridge - migrated from deprecated pyo3-asyncio to pyo3-async-runtimes
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime"] }

# Async runtime with full features for robust networking
tokio = { version = "1.42", features = ["full"] }

# Core utilities
async-trait = "0.1"
futures = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
env_logger = "0.11"
log = "0.4"

# Time and encoding utilities
chrono = "0.4"
base64 = "0.22"
bs58 = "0.5"
multihash = "0.19"

# Async utilities
async-stream = "0.3"

# Static initialization (consider replacing with OnceLock in future)
lazy_static = "1.5"

[lib]
name = "libp2p_pyrust"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
overflow-checks = false

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.test]
opt-level = 1
debug = true
